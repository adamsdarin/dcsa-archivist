[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dcsa-library-custodian"
version = "0.1.0"
description = "Preview-first maintenance and release tooling for a portable DCSA retrieval library"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dcsa-custodian = "dcsa_custodian.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
