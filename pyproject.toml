[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dcsa-library-custodian"
version = "0.1.0"
description = "Preview-first maintenance and release tooling for a portable DCSA retrieval library"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.8.0",
]

[project.optional-dependencies]
# voi-intake-plan refuses any other version: a different pypdf wraps lines differently,
# which changes the robot text hash of unchanged content (src/dcsa_custodian/voi_intake.py).
voi = ["pypdf==6.0.0"]

[project.scripts]
dcsa-custodian = "dcsa_custodian.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
